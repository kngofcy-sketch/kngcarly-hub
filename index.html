<script>
    async function syncPreSave() {
      try {
        const res = await fetch('./releases.json');
        if (!res.ok) return;
        const releases = await res.json();
        const current = releases.find(r => r.active && r.featured) || releases[0];
        if (!current) return;

        // 1. Actualiza todos los enlaces que apuntan a ReleaseJet
        document.querySelectorAll('a[href*="releasejet.ai"]').forEach(a => {
          a.href = current.preSaveUrl;
        });

        // 2. Actualiza los textos de fecha en el Hero
        const heroDate = document.querySelector('#hero span.text-kngRed');
        if (heroDate) heroDate.textContent = `PRÓXIMO ESTRENO • ${current.releaseDate.toUpperCase()}`;

        // 3. Actualiza el botón de Pre-Save del Hero
        const heroBtn = document.querySelector('#hero a[href*="releasejet.ai"]');
        if (heroBtn) {
          heroBtn.innerHTML = `<i class="fa-solid fa-fire text-base"></i> Pre-Save "${current.title}"`;
        }

        // 4. Actualiza la tarjeta de Pre-Save en Enlaces Rápidos
        const quickCard = document.querySelector('#quick-links a[href*="releasejet.ai"]');
        if (quickCard) {
          const spans = quickCard.querySelectorAll('span');
          if (spans[0]) spans[0].textContent = `Pre-Save "${current.title}"`;
          if (spans[1]) spans[1].textContent = `Estreno ${current.releaseDate} • Guarda el tema en tu librería`;
        }

        // 5. Actualiza la barra fija inferior (Player Bar)
        const barTrackTitle = document.querySelector('.fixed.bottom-0 p.font-headline');
        if (barTrackTitle) barTrackTitle.textContent = `${current.title} - PRE-SAVE`;

        const barTrackDate = document.querySelector('.fixed.bottom-0 span.text-kngRed');
        if (barTrackDate) barTrackDate.textContent = `ESTRENO ${current.releaseDate.toUpperCase()}`;

        const barCover = document.querySelector('.fixed.bottom-0 img');
        if (barCover && current.cover) barCover.src = `./${current.cover}`;

      } catch (e) {
        console.error('Error cargando pre-save:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', syncPreSave);
  </script>
